name: Build Windows executable

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install .
          pip install pyinstaller==6.11.1

      - name: Build DroidPilot.exe
        run: >
          pyinstaller --noconfirm --clean --name DroidPilot --windowed --onefile
          --collect-submodules droidpilot
          packaging/droidpilot_app.py

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: DroidPilot-windows
          path: dist/DroidPilot.exe

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/DroidPilot.exe
